 [build-system]

requires = ["setuptools>=61.0"]

build-backend = "setuptools.build_meta"


[project]

name = "mecture_late"

version = "0.1.0"

description = "AI-powered lecture note generator"

dependencies = [

"google-genai",

"python-dotenv",

"pathlib",

"streamlit",

"supabase",

]


[tool.setuptools.packages.find]

where = ["src"]

[project.scripts]
mecture = "mecture_late.main:main"
mecture-web = "mecture_late.run_web:main"